<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Saved Credentials</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            color: white;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #f7fafc;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
        }

        tr:hover {
            background: #f7fafc;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-personal {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge-business {
            background: #c6f6d5;
            color: #22543d;
        }

        .password-hash {
            font-family: monospace;
            font-size: 12px;
            color: #718096;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timestamp {
            font-size: 13px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Saved Credentials Dashboard</h1>
        <p style="color: #718096; margin-top: 5px;">View all captured login credentials</p>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Credentials</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Personal Accounts</h3>
                <div class="number" id="personalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Business Accounts</h3>
                <div class="number" id="businessCount">0</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="loadCredentials()">Refresh Data</button>
            <select id="filterType" onchange="loadCredentials()">
                <option value="all">All Types</option>
                <option value="personal">Personal Only</option>
                <option value="business">Business Only</option>
            </select>
            <button onclick="exportToCSV()">Export to CSV</button>
        </div>

        <div id="errorMessage"></div>
        <div id="tableContainer">
            <div class="loading">Loading credentials...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './config.js';

        window.supabase = supabase;

        async function loadCredentials() {
            const filterType = document.getElementById('filterType').value;
            const tableContainer = document.getElementById('tableContainer');
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.innerHTML = '';
            tableContainer.innerHTML = '<div class="loading">Loading credentials...</div>';

            try {
                let query = supabase
                    .from('user_credentials')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (filterType !== 'all') {
                    query = query.eq('account_type', filterType);
                }

                const { data, error } = await query;

                if (error) {
                    throw error;
                }

                // Update stats
                const personalCount = data.filter(c => c.account_type === 'personal').length;
                const businessCount = data.filter(c => c.account_type === 'business').length;

                document.getElementById('totalCount').textContent = data.length;
                document.getElementById('personalCount').textContent = personalCount;
                document.getElementById('businessCount').textContent = businessCount;

                // Display table
                if (data.length === 0) {
                    tableContainer.innerHTML = '<div class="loading">No credentials saved yet.</div>';
                    return;
                }

                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Password Hash</th>
                                <th>Account Type</th>
                                <th>Created At</th>
                                <th>Last Login</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(record => {
                    const createdAt = new Date(record.created_at).toLocaleString();
                    const lastLogin = record.last_login ? new Date(record.last_login).toLocaleString() : 'Never';
                    const badgeClass = record.account_type === 'personal' ? 'badge-personal' : 'badge-business';

                    tableHTML += `
                        <tr>
                            <td><strong>${record.username}</strong></td>
                            <td><span class="password-hash" title="${record.password_hash}">${record.password_hash}</span></td>
                            <td><span class="badge ${badgeClass}">${record.account_type}</span></td>
                            <td class="timestamp">${createdAt}</td>
                            <td class="timestamp">${lastLogin}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                tableContainer.innerHTML = tableHTML;

            } catch (err) {
                console.error('Error loading credentials:', err);
                errorMessage.innerHTML = `<div class="error">Error loading credentials: ${err.message}</div>`;
                tableContainer.innerHTML = '';
            }
        }

        async function exportToCSV() {
            try {
                const { data, error } = await supabase
                    .from('user_credentials')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                let csv = 'Username,Password Hash,Account Type,Created At,Last Login\n';

                data.forEach(record => {
                    csv += `"${record.username}","${record.password_hash}","${record.account_type}","${record.created_at}","${record.last_login || ''}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `credentials-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Error exporting data: ' + err.message);
            }
        }

        window.loadCredentials = loadCredentials;
        window.exportToCSV = exportToCSV;

        // Load data on page load
        loadCredentials();
    </script>
</body>
</html>
